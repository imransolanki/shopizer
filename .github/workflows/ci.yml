name: CI

on:
  push:
    branches: [ main, master, develop, 3.2.7 ]
  pull_request:
    branches: [ main, master, develop, 3.2.7 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'
      - run: ./mvnw clean install
